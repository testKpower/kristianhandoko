const grid = document.getElementById("grid");
const searchInput = document.getElementById("searchInput");

function createCard(cam) {
  const card = document.createElement("div");
  card.className = "bg-gray-800 rounded-2xl shadow-lg overflow-hidden";

  const header = document.createElement("div");
  header.className = "p-3 flex justify-between items-center";

  const title = document.createElement("span");
  title.textContent = cam.name;

  const status = document.createElement("span");
  status.textContent = "Loading...";
  status.className = "text-sm";

  header.appendChild(title);
  header.appendChild(status);

  const iframe = document.createElement("iframe");
  iframe.src = cam.url;
  iframe.className = "w-full h-64";

  iframe.onload = () => {
    status.textContent = "● Online";
    status.className = "text-green-400 text-sm";
  };

  iframe.onerror = () => {
    status.textContent = "● Offline";
    status.className = "text-red-400 text-sm";
  };

  // fallback timeout (kalau blank)
  setTimeout(() => {
    if (status.textContent === "Loading...") {
      status.textContent = "● Unknown";
      status.className = "text-yellow-400 text-sm";
    }
  }, 5000);

  card.appendChild(header);
  card.appendChild(iframe);

  return card;
}

function render(filter = "") {
  grid.innerHTML = "";
  cameras
    .filter(cam => cam.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(cam => grid.appendChild(createCard(cam)));
}

searchInput.addEventListener("input", (e) => {
  render(e.target.value);
});

render();
</script>
